[project]
name = "onair"
version = "0.1.0"
description = "Interactive REPL shell radio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Roman Kaczanowski", email = "roman.kaczanowski.pl@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit",
    "python-vlc",
    "requests",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/roman-kaczanowski/onair"
Repository = "https://github.com/roman-kaczanowski/onair"
Issues = "https://github.com/roman-kaczanowski/onair/issues"

[project.scripts]
onair = "onair.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onair"]

[tool.uv]
default-groups = ["dev", "test"]


[dependency-groups]
dev = ["ruff", "ipython", "pre-commit", "poethepoet", "mdformat", "mdformat-gfm", "mdformat-tables"]
test = ["pytest"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "N",
    "UP",
    # "PL",
    # "RUF",
]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.poe]
executor = { type = "uv" }
shell_interpreter = "bash"

[tool.poe.tasks]
lock = "uv lock"
install = "uv sync"
hooks = "pre-commit install"
update = "uv lock --upgrade"
upgrade.sequence = ["update", "install"]
format = [{ cmd = "ruff format ." }, { cmd = "ruff check . --fix" }]
check = [{ cmd = "ruff format . --check" }, { cmd = "ruff check ." }]
test = "pytest"
format_docs = { shell = "git ls-files '*.md' | xargs mdformat" }
check_docs = { shell = "git ls-files '*.md' | xargs mdformat --check" }
patch = "uv version --bump patch"
minor = "uv version --bump minor"
major = "uv version --bump major"
